[pytest]
# Pytest configuration for AI-Powered Smart Student Learning Assistant

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers for categorizing tests
markers =
    auth: Authentication tests
    authz: Authorization and permission tests
    student: Student feature tests
    faculty: Faculty feature tests
    admin: Admin feature tests
    document: Document processing tests
    quiz: Quiz system tests
    flashcard: Flashcard system tests
    analytics: Analytics tests
    ai: AI and RAG tests
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests

# Coverage configuration
[coverage:run]
source = backend/app
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
